<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleet — maintenance log</title>
<meta name="description" content="Maintenance tracking for autos, equipment, boats and recreational vehicles." />
<meta name="theme-color" content="#10161d" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2310161d'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23f0a33b' stroke-width='2.5' stroke-dasharray='42 15' transform='rotate(120 16 16)'/><circle cx='16' cy='16' r='2' fill='%23f0a33b'/></svg>" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/fleet">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="9" stroke="#f0a33b" stroke-width="2" stroke-dasharray="42 15" transform="rotate(120 12 12)"/>
      <path d="M12 12 L16.5 8.5" stroke="#e8eff5" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="1.7" fill="#f0a33b"/>
    </svg>
    Fleet <small>what's due, what's done</small>
  </a>
  <span class="topbar-spacer"></span>
  <a class="btn btn-sm btn-ghost" href="#/settings" title="Backup, restore and research key">Settings</a>
  <a class="btn btn-sm btn-primary" href="#/add">Add vehicle</a>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dlg-head">
      <h2 id="dlgTitle">Log service</h2>
      <button class="btn btn-sm btn-ghost" value="cancel" type="submit" aria-label="Close">Close</button>
    </div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot" id="dlgFoot"></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="plans.js"></script>
<script src="app.js"></script>
</body>
</html>
